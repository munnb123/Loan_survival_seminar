   <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #718096" x="72.576" y="75.816" transform="rotate(-0 72.576 75.816)">HYPOTHETICAL · A hazard is an instantaneous rate, not a probability</text>
  </g>
  <g id="text_25">
   <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142d4e" x="114.048" y="524.88" transform="rotate(-0 114.048 524.88)">The baseline hazard can vary over time; proportionality concerns the ratio.</text>
